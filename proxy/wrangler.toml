# Cloudflare Worker for the "any ticker" feature. Setup steps: proxy/README.md.
name = "support-levels-proxy"
main = "worker.mjs"
compatibility_date = "2025-06-01"

[vars]
# the report's GitHub repository, the branch its workflows run from, and the branch with its data
GITHUB_REPO = "mpromisel002/TQQQ-Technical-Analysis-Report"
GITHUB_REF = "main"
DATA_BRANCH = "market-data"
# only the report's own pages may call the Worker
ALLOW_ORIGIN = "https://mpromisel002.github.io"
MAX_TICKERS = "50"
ADDS_PER_DAY = "5"

# the per-visitor limit on additions; create it with:
#   npx wrangler kv namespace create LIMITS
# and paste the id it prints here. Deployed from the Cloudflare dashboard instead, this file
# is not read at all: the namespace is bound there and the id below stays as it is.
[[kv_namespaces]]
binding = "LIMITS"
id = "PASTE-THE-ID-HERE"
