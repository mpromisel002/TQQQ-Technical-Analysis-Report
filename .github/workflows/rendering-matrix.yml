name: Every chart combination

# Draws the main chart in every combination of time frame, Daily/Mondays, light/dark
# and all 256 settings of the 8 chart switches, in Chrome on a desktop and a phone and in
# Safari's engine on a Mac and an iPhone (20,480 renders), and checks each one
# (tests/browser/rendering.spec.js). One job per screen, run side by side: measured on an
# 8-core Mac, Chrome takes 7 minutes for both screens and Safari 23.
# Pull requests run a smaller set of the same checks in tests.yml.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays, 09:00 New York (EDT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Every chart combination (${{ matrix.screen }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { screen: desktop, browser: chromium }
          - { screen: phone, browser: chromium }
          - { screen: safari, browser: webkit }
          - { screen: iphone, browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Draw and check every combination
        env:
          FULL_MATRIX: "1"
        run: npx playwright test tests/browser/rendering.spec.js --project=${{ matrix.screen }}
      - name: Keep the report when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-matrix-report-${{ matrix.screen }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
