name: Refresh TQQQ data

on:
  schedule:
    # Six attempts every half hour from 16:15 New York, the earliest point the
    # pipeline will accept a same-day bar (fetch.py treats a session as complete
    # from 16:15). GitHub queues scheduled runs on shared infrastructure and starts
    # them 1-4 hours late in practice, so no single slot is dependable: whichever
    # one first finds a new session publishes it, and the rest exit in about 30
    # seconds without committing. Actions minutes are free on a public repository.
    #
    # Cron is UTC and does not follow daylight saving, so these are anchored to
    # EDT. Summer: 16:15 - 18:45 New York. Winter: 15:15 - 17:45, where the first
    # two land before the close, find nothing and cost ~30s each.
    - cron: "15 20 * * 1-5"   # 16:15 New York (EDT)
    - cron: "45 20 * * 1-5"   # 16:45
    - cron: "15 21 * * 1-5"   # 17:15   <- 16:15 New York in winter (EST)
    - cron: "45 21 * * 1-5"   # 17:45
    - cron: "15 22 * * 1-5"   # 18:15
    - cron: "45 22 * * 1-5"   # 18:45
    # 11:30 UTC Tue-Sat = 7:30 am New York, before the next open. Final backstop if
    # every evening slot was delayed past midnight or dropped altogether.
    - cron: "30 11 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if there is no new session"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Unit tests (Python + JavaScript)
        run: |
          python -m pytest -q pipeline/tests
          node --test tests/*.test.js

      - name: Download, validate and build data
        id: build
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          set +e
          python pipeline/build.py ${{ inputs.force && '--force' || '' }}
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "No new session (weekend or market holiday) - nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Snapshot support levels
        if: steps.build.outputs.changed == 'true'
        run: node pipeline/snapshot.js

      - name: Commit and push
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          AS_OF=$(python -c "import json;print(json.load(open('docs/data/tqqq.json'))['meta']['as_of'])")
          PREV=$(git show HEAD:docs/data/tqqq.json | python -c "import json,sys;print(json.load(sys.stdin)['meta']['as_of'])")
          # same session republished = the source corrected a bar we had already shipped
          if [ "$AS_OF" = "$PREV" ]; then
            git commit -m "Data revision: TQQQ as of ${AS_OF}"
          else
            git commit -m "Data refresh: TQQQ as of ${AS_OF}"
          fi
          git push

      - name: Open an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Daily data refresh failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TODAY=$(date -u +%Y-%m-%d)
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again on $TODAY: $RUN_URL"
          else
            printf 'The scheduled refresh failed on %s. The site keeps showing the last good data.\n\nRun: %s\n' "$TODAY" "$RUN_URL" > body.md
            gh issue create --title "$TITLE" --body-file body.md
          fi
